<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#222222"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #111111; }
      .stage { font-size: 18px; font-weight: 700; }
      .lane { font-size: 16px; font-weight: 700; }
      .title { font-size: 19px; font-weight: 700; text-anchor: middle; }
      .body { font-size: 15px; text-anchor: middle; }
      .small { font-size: 13px; fill: #444444; text-anchor: middle; }
      .box { stroke: #222222; stroke-width: 1.6; rx: 5; ry: 5; }
      .dataset { fill: #eaf3ea; }
      .condition { fill: #edf5f7; }
      .preprocess { fill: #f4f4f4; }
      .model { fill: #eaf1f8; }
      .pe { fill: #f9eee5; }
      .evaluation { fill: #f0edf8; }
      .arrow { fill: none; stroke: #222222; stroke-width: 2; marker-end: url(#arrow); }
      .connector { fill: none; stroke: #222222; stroke-width: 2; }
      .separator { stroke: #b8b8b8; stroke-width: 1.2; stroke-dasharray: 6 6; }
      .note { font-size: 13px; fill: #444444; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="860" fill="#ffffff"/>

  <text x="70" y="48" class="stage">DATA PREPARATION</text>
  <text x="1015" y="48" class="stage">COMMON TRAINING AND EVALUATION PIPELINE</text>
  <line x1="965" y1="25" x2="965" y2="815" class="separator"/>

  <text x="70" y="92" class="lane">CIFAR-10 experiments</text>

  <rect x="70" y="118" width="230" height="94" class="box dataset"/>
  <text x="185" y="150" class="title">CIFAR-10</text>
  <text x="185" y="177" class="body">45,000-image training pool</text>
  <text x="185" y="199" class="small">5,000 validation · 10,000 test</text>

  <rect x="375" y="100" width="250" height="78" class="box condition"/>
  <text x="500" y="132" class="title">Full-data condition</text>
  <text x="500" y="158" class="body">45,000 training images</text>

  <rect x="375" y="210" width="250" height="96" class="box condition"/>
  <text x="500" y="241" class="title">Reduced-data conditions</text>
  <text x="500" y="267" class="body">1,000 · 5,000 · 10,000 images</text>
  <text x="500" y="289" class="small">sampled from the same training pool</text>

  <path d="M300 165 H338 V139 H363" class="arrow"/>
  <path d="M338 165 V258 H363" class="arrow"/>

  <rect x="705" y="154" width="230" height="106" class="box preprocess"/>
  <text x="820" y="184" class="title">CIFAR-10 preprocessing</text>
  <text x="820" y="211" class="body">Training: crop + horizontal flip</text>
  <text x="820" y="235" class="body">CIFAR-10 normalisation</text>

  <path d="M625 139 H665 V190 H693" class="arrow"/>
  <path d="M625 258 H665 V224 H693" class="arrow"/>

  <text x="70" y="386" class="lane">CIFAR-100 experiment</text>

  <rect x="70" y="412" width="230" height="94" class="box dataset"/>
  <text x="185" y="444" class="title">CIFAR-100</text>
  <text x="185" y="471" class="body">45,000-image training pool</text>
  <text x="185" y="493" class="small">5,000 validation · 10,000 test</text>

  <rect x="375" y="420" width="250" height="78" class="box condition"/>
  <text x="500" y="452" class="title">Full-data condition</text>
  <text x="500" y="478" class="body">45,000 training images</text>

  <path d="M300 459 H363" class="arrow"/>

  <rect x="705" y="406" width="230" height="106" class="box preprocess"/>
  <text x="820" y="436" class="title">CIFAR-100 preprocessing</text>
  <text x="820" y="463" class="body">Training: crop + horizontal flip</text>
  <text x="820" y="487" class="body">CIFAR-100 normalisation</text>

  <path d="M625 459 H693" class="arrow"/>

  <path d="M935 207 H980 V186 H1008" class="arrow"/>
  <path d="M935 459 H980 V186" class="connector"/>

  <rect x="1020" y="138" width="230" height="96" class="box model"/>
  <text x="1135" y="170" class="title">Patch projection</text>
  <text x="1135" y="197" class="body">4 × 4 patches</text>
  <text x="1135" y="219" class="small">8 × 8 patch grid</text>

  <path d="M1135 234 V274" class="arrow"/>

  <rect x="1020" y="286" width="230" height="88" class="box pe"/>
  <text x="1135" y="318" class="title">Add positional encoding</text>
  <text x="1135" y="345" class="body">learned or fixed PE</text>
  <text x="1135" y="364" class="small">same insertion point</text>

  <path d="M1135 374 V414" class="arrow"/>

  <rect x="1020" y="426" width="230" height="96" class="box model"/>
  <text x="1135" y="458" class="title">Shared ViT training</text>
  <text x="1135" y="485" class="body">same architecture and protocol</text>
  <text x="1135" y="507" class="small">five seeds: 42–46</text>

  <path d="M1250 474 H1288" class="arrow"/>

  <rect x="1300" y="426" width="230" height="96" class="box evaluation"/>
  <text x="1415" y="458" class="title">Checkpoint selection</text>
  <text x="1415" y="485" class="body">best validation accuracy</text>
  <text x="1415" y="507" class="small">one checkpoint per run</text>

  <path d="M1415 522 V562" class="arrow"/>

  <rect x="1300" y="574" width="230" height="96" class="box evaluation"/>
  <text x="1415" y="606" class="title">Held-out test evaluation</text>
  <text x="1415" y="633" class="body">test accuracy and test loss</text>
  <text x="1415" y="655" class="small">evaluated after checkpoint selection</text>

  <path d="M1415 670 V710" class="arrow"/>

  <rect x="1300" y="722" width="230" height="80" class="box evaluation"/>
  <text x="1415" y="754" class="title">Report results</text>
  <text x="1415" y="781" class="body">mean ± 95% confidence interval</text>

</svg>
